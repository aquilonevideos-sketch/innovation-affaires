<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merci · Innovation Affaires</title>
<link rel="icon" href="assets/monogramme-ia.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;background:#122536;color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px}
.box{max-width:520px}
.mono{background:#fff;border-radius:22px;width:120px;height:120px;display:grid;place-items:center;margin:0 auto 28px}
.mono img{width:84px}
h1{font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(2rem,6vw,2.8rem);margin-bottom:16px}
h1 em{font-style:normal;color:#E2C08D}
p{color:#C9D3DC;line-height:1.6}
a{display:inline-block;margin-top:30px;padding:.95em 1.6em;border-radius:999px;background:linear-gradient(135deg,#E2C08D,#C4955A);color:#122536;font-family:Montserrat,sans-serif;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <div class="mono"><img src="assets/monogramme-ia.svg" alt="Innovation Affaires"></div>
  <h1>Merci, <em>à vendredi !</em></h1>
  <p>Votre demande d'invitation est bien arrivée. Un membre du club vous recontacte pour vous accueillir à une prochaine réunion, le vendredi à 7h15 au 89 rue Raspail, La Garde.</p>
  <a href="./">Retour au site</a>
</div>
</body>
</html>
